	<div class="row">
		<div class="col-12">
			<div id="company-add">
				<svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
					<path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"></path>
					<path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"></path>
				</svg>
			</div>
		</div>
	</div>

	<main>
		<div id="company-view">
			<div class="row">
			</div>
			<div class="row">
				<div class="col-12">

				</div>
			</div>
		</div>

		<!-- Modal for adding a new company -->
		<div class="modal fade" id="companyModal" tabindex="-1" aria-labelledby="companyModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="companyModalLabel">Přidej novou společnost</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form id="companyForm">
							<div class="mb-3">
								<label for="ident" class="form-label">Ident</label>
								<input type="text" class="form-control" id="ident" name="ident" required>
							</div>
							<div class="mb-3">
								<label for="company" class="form-label">Company</label>
								<input type="text" class="form-control" id="company" name="company" required>
							</div>
							<div class="mb-3">
								<label for="category" class="form-label">Category</label>
								<input type="text" class="form-control" id="category" name="category" required>
							</div>
							<div class="mb-3">
								<label for="subcategory" class="form-label">Subcategory</label>
								<input type="text" class="form-control" id="subcategory" name="subcategory" required>
							</div>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Zrušit</button>
						<button type="button" class="btn btn-primary" id="confirmAddCompany">Potvrdit</button>
					</div>
				</div>
			</div>
		</div>



	</main>

	<footer>
		<hr>
		<p class="text-center small fw-bold">
			Created by KavCZ 2024
		</p>
	</footer>

	<script src="../js/settingScript.js" defer></script>

</body>

</html>
